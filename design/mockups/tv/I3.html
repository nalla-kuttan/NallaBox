<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I3 · Bet — NallaBox</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/components.css">
<link rel="stylesheet" href="../shared/frame.css"><style>
.question { font-size: var(--fs-title); font-weight: 900; line-height: 1.2; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.surface-tv .choice { font-size: var(--fs-heading); --pad: 28px; }
.surface-tv .choice__key { width: 1.5em; height: 1.5em; }
.bets { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; width: 100%; }
.bet { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 12px; background: rgba(30,27,46,.5); font-size: 30px; font-weight: 800; }
.bet .avatar { --avatar: 40px; font-size: 20px; }
.choice-col { display: flex; flex-direction: column; align-items: flex-start; }
.waiting-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.waiting-grid .avatar { --avatar: 52px; font-size: 26px; }
.waiting-grid .player-chip { font-size: 36px; }
.accuse-count { flex: none; min-width: 1.6em; padding: 0 .3em; border-radius: 10px; background: var(--nb-color-coral); color: #fff; font-weight: 900; text-align: center; }
.unmask { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; flex: 1; min-height: 0; }
.unmask__hero { display: flex; flex-direction: column; gap: 24px; justify-content: center; }
.tv-foot { display: flex; justify-content: space-between; color: var(--nb-color-text-dim); font-size: var(--fs-caption); font-weight: 700; margin-top: auto; }
.ph-q { font-size: calc(20px * var(--nb-text-scale, 1)); font-weight: 900; line-height: 1.25; }
.ph-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ph-choices .choice { --pad: 12px; font-size: calc(16px * var(--nb-text-scale, 1)); }
.result-hero { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 16px; border-radius: var(--nb-radius-xl); background: var(--nb-color-ink-raised); width: 100%; }
.points-big { font-size: 44px; font-weight: 900; }
.accuse-list { display: flex; flex-direction: column; gap: 8px; }
.accuse-list .player-chip { --pad: 12px; border: 3px solid transparent; }
.accuse-list .player-chip.is-selected { border-color: var(--nb-color-coral); }
.chips-left { font-weight: 800; color: var(--nb-color-text-dim); font-size: var(--fs-caption); text-align: center; }
</style>
</head>
<body data-screen="I3" data-surface="tv">
<main class="screen">
<div class="tv-safe"><div class="tv-top"><div class="tv-top__left"><p class="t-label t-dim">Insider Trading · Round 3 of 6</p></div><div class="tv-top__right"><span class="timer-pill">0:15</span><div class="face-corner"><p class="face-corner__caption">Bets close in 15 seconds.</p><img class="face" src="../shared/face/face-wink.svg" alt=""></div></div></div><p class="question">Which planet has the most known moons?</p><p class="t-heading">Place your bets: 100 to 1,000 chips</p><div class="stack"><p class="t-label t-dim">Waiting on 3 players</p><div class="waiting-grid"><div class="player-chip is-submitted"><span class="avatar avatar--m" data-player="saffron" aria-hidden="true">P</span><span class="player-chip__name">Priya</span><span class="chip-tick" aria-label="done">✓</span></div><div class="player-chip "><span class="avatar avatar--m" data-player="sky" aria-hidden="true">S</span><span class="player-chip__name">Sam</span></div><div class="player-chip is-submitted"><span class="avatar avatar--m" data-player="mint" aria-hidden="true">M</span><span class="player-chip__name">Marcus</span><span class="chip-tick" aria-label="done">✓</span></div><div class="player-chip is-submitted"><span class="avatar avatar--m" data-player="lilac" aria-hidden="true">L</span><span class="player-chip__name">Lena</span><span class="chip-tick" aria-label="done">✓</span></div><div class="player-chip "><span class="avatar avatar--m" data-player="pink" aria-hidden="true">W</span><span class="player-chip__name">Wolfgangster</span></div><div class="player-chip is-submitted"><span class="avatar avatar--m" data-player="lime" aria-hidden="true">A</span><span class="player-chip__name">Aiko</span><span class="chip-tick" aria-label="done">✓</span></div><div class="player-chip is-submitted"><span class="avatar avatar--m" data-player="teal" aria-hidden="true">D</span><span class="player-chip__name">Dev</span><span class="chip-tick" aria-label="done">✓</span></div><div class="player-chip "><span class="avatar avatar--m" data-player="sand" aria-hidden="true">R</span><span class="player-chip__name">Rosa</span></div></div></div></div>
</main>
<script src="../shared/screens.js"></script>
<script src="../shared/frame.js"></script>
</body></html>
